<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генерация</title>
<style>
  :root {
    --bg: #111214; --panel: #17181b; --line: #26282c; --text: #e6e6e6; --dim: #8b8f96;
    --accent: #c8a2ff; --danger: #ff6b6b; --fav: #ffd166; --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: grid;
         grid-template-columns: 320px 1fr; grid-template-rows: 1fr 210px; height: 100vh; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; white-space: nowrap;
           cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); color: #111; border: 0; font-weight: 600; padding: 10px; width: 100%; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover { color: var(--text); border-color: var(--line); }
  button.on { color: var(--fav); }
  select, input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
                            padding: 6px 8px; width: 100%; }
  textarea { resize: vertical; min-height: 120px; }
  label { color: var(--dim); font-size: 12px; display: block; margin: 10px 0 4px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  .row > .fit { flex: 0 0 auto; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--dim); font-size: 13px; cursor: pointer; }
  .check input { width: auto; margin: 0; accent-color: var(--accent); }

  #side { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); padding: 14px;
          overflow-y: auto; display: flex; flex-direction: column; }
  #side h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  #queue { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .qitem { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; font-size: 12px; }
  .qitem .pv { float: right; height: 54px; margin-left: 8px; border-radius: 4px; }
  #loaded { margin-top: 10px; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #loaded .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  #loaded.on .dot { background: #6bd88a; }
  #loaded button { margin-left: auto; padding: 2px 8px; font-size: 12px; }
  .qitem .p { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  #err { margin-top: 10px; border: 1px solid var(--danger); border-radius: var(--radius); padding: 8px;
         font: 11px/1.35 ui-monospace, monospace; color: var(--danger); white-space: pre-wrap; max-height: 160px;
         overflow: auto; cursor: pointer; }
  .drop { border: 1px dashed var(--line); border-radius: var(--radius); padding: 8px; display: flex; align-items: center;
          gap: 8px; color: var(--dim); font-size: 12px; cursor: pointer; min-height: 44px; }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop img { height: 64px; border-radius: 4px; }
  .drop button { margin-left: auto; }
  .hint { color: var(--dim); font-size: 12px; margin-top: auto; padding-top: 14px; }

  #view { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #view img.main { width: 100%; height: 100%; object-fit: contain; }
  #view .empty { color: var(--dim); }
  #meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; display: flex; gap: 8px;
          align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0;
          transition: opacity .15s; }
  #view:hover #meta { opacity: 1; }
  #meta .info { flex: 1; font-size: 12px; color: #ccc; overflow: hidden; }
  #meta .info .prompt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nav-prev, #nav-next { position: absolute; top: 50%; transform: translateY(-50%); opacity: 0; }
  #view:hover #nav-prev, #view:hover #nav-next { opacity: .8; }
  #nav-prev { left: 10px; } #nav-next { right: 10px; }

  #strip { border-top: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  #strip .tools { display: flex; gap: 6px; align-items: center; padding: 8px 10px; }
  #strip .tools input { width: 220px; flex: 0 0 auto; }
  #strip .tools .count { color: var(--dim); font-size: 12px; margin-left: auto; }
  #grid { flex: 1; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 0 10px 10px; }
  .thumb { position: relative; flex: 0 0 auto; height: 100%; border-radius: 6px; overflow: hidden; cursor: pointer;
           outline: 2px solid transparent; }
  .thumb img { height: 100%; display: block; }
  .thumb.active { outline-color: var(--dim); }
  .thumb.sel { outline-color: var(--accent); }
  .thumb .star { position: absolute; top: 4px; right: 6px; color: var(--fav); text-shadow: 0 0 3px #000; }
  .thumb .chk { position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 4px;
                border: 1px solid #fff8; background: #0006; display: none; }
  .selecting .thumb .chk { display: block; }
  .thumb.sel .chk { background: var(--accent); border-color: var(--accent); }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #000c;
           padding: 8px 14px; border-radius: var(--radius); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<aside id="side">
  <h1>Генерация</h1>

  <label for="mode">Модель</label>
  <select id="mode"></select>

  <label for="prompt">Промпт</label>
  <textarea id="prompt" placeholder="1girl, solo, kimono, garden, smile, ..."></textarea>

  <label>Исходная картинка (img2img) — необязательно</label>
  <div id="init" class="drop" title="Нажмите, чтобы выбрать файл">
    <img id="init-pv" hidden alt="">
    <span id="init-hint">перетащите сюда картинку или миниатюру из ленты, Ctrl+V или нажмите</span>
    <button id="init-clear" class="ghost fit" hidden title="Убрать исходную картинку">✕</button>
  </div>
  <input id="init-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <div id="strength-row" hidden>
    <label for="strength" title="Насколько сильно перерисовать: меньше — ближе к исходнику, больше — свободнее">
      Сила изменения: <b id="strength-val"></b></label>
    <input id="strength" type="range" min="0.2" max="0.95" step="0.05" value="0.75">
  </div>

  <label for="size">Разрешение</label>
  <div class="row">
    <select id="size"></select>
    <button id="flip" class="fit" title="Повернуть: вертикально ↔ горизонтально">⇄</button>
  </div>

  <div class="row">
    <div><label for="steps">Шаги</label><input id="steps" type="number" min="1" max="100"></div>
    <div><label for="count">Картинок</label><input id="count" type="number" min="1" max="100" value="1"></div>
  </div>

  <label for="seed">Seed (−1 — случайный)</label>
  <div class="row">
    <input id="seed" type="number" value="-1">
    <button id="seed-rand" class="fit" title="Случайный seed">−1</button>
  </div>

  <label class="check" title="Сразу увеличивать каждую картинку в 2 раза (realesr-animevideov3, ~1–2 с)">
    <input id="upscale" type="checkbox" checked> апскейл ×2 сразу</label>

  <div style="margin-top:14px"><button id="go" class="primary">Сгенерировать</button></div>

  <div id="loaded"><span class="dot"></span><span id="loaded-text">модель не загружена</span>
    <button id="unload" class="ghost" title="Освободить память GPU">выгрузить</button></div>
  <div id="queue"></div>
  <div id="err" hidden title="Нажмите, чтобы скрыть"></div>

  <div class="hint">
    Ctrl+Enter — генерация · ← → — листать · F — в избранное · Del — в корзину ·
    S — режим выбора · Esc — снять выбор · Ctrl+V — вставить исходную картинку
  </div>
</aside>

<main id="view">
  <div class="empty">Здесь появится картинка</div>
  <button id="nav-prev" class="ghost">‹</button>
  <button id="nav-next" class="ghost">›</button>
  <div id="meta" hidden>
    <div class="info"><div class="prompt" id="m-prompt"></div><div id="m-params"></div></div>
    <button id="m-fav" class="ghost" title="В избранное (F)">☆</button>
    <button id="m-reuse" class="ghost" title="Подставить все настройки">↺ настройки</button>
    <button id="m-init" class="ghost" title="Сделать исходной картинкой для img2img">→ img2img</button>
    <button id="m-seed" class="ghost" title="Подставить этот seed">seed</button>
    <button id="m-copy" class="ghost" title="Скопировать промпт">копировать</button>
    <button id="m-up" class="ghost" title="Апскейл ×2 (~2 с)">×2</button>
    <button id="m-trash" class="ghost" title="В корзину (Del)">🗑</button>
  </div>
</main>

<section id="strip">
  <div class="tools">
    <button id="f-all" class="ghost on">Все</button>
    <button id="f-fav" class="ghost">★ Избранное</button>
    <input id="search" placeholder="Поиск по промпту">
    <button id="select" class="ghost" title="Режим выбора (S)">Выбрать</button>
    <button id="sel-all" class="ghost" hidden>Все видимые</button>
    <button id="sel-fav" class="ghost" hidden>★ выбранные</button>
    <button id="sel-trash" class="ghost" hidden>🗑 выбранные</button>
    <button id="trash-all" class="ghost">🗑 все видимые</button>
    <button id="folder" class="ghost" title="Открыть папку с картинками">папка</button>
    <span class="count" id="count-info"></span>
  </div>
  <div id="grid"></div>
</section>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = (path, body) => fetch(path, body === undefined ? {} :
  {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json());

let config = {}, items = [], version = -1, shown = null, filter = 'all', selecting = false;
const selected = new Set();

function toast(text) {
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- form ----------
// the list holds one orientation at a time; the ⇄ button flips all of it
let landscape = false;
const rev = s => s.split('x').reverse().join('x');
function fillSizes(mode, keep) {
  const sel = $('#size'), {sizes, times = {}} = config[mode];
  const base = keep && sizes.find(s => s === keep || rev(s) === keep);
  if (base && base !== rev(base)) landscape = keep !== base;
  sel.innerHTML = '';
  for (const s of sizes) {
    const o = document.createElement('option'); o.value = landscape ? rev(s) : s;
    o.textContent = o.value.replace('x', ' × ') + (times[s] ? `  · ${times[s]}` : ''); sel.append(o);
  }
  sel.value = base ? (landscape ? rev(base) : base) : (landscape ? rev(config[mode].size) : config[mode].size);
}
function saveForm() {
  const f = {mode: $('#mode').value, prompt: $('#prompt').value, size: $('#size').value,
             steps: $('#steps').value, count: $('#count').value, seed: $('#seed').value, upscale: $('#upscale').checked,
             init: initName, strength: $('#strength').value};
  try { localStorage.setItem('form', JSON.stringify(f)); } catch (e) {}
}
function loadForm() {
  let f = {};
  try { f = JSON.parse(localStorage.getItem('form') || '{}'); } catch (e) {}
  const mode = config[f.mode] ? f.mode : Object.keys(config)[0];
  $('#mode').value = mode; fillSizes(mode, f.size);
  $('#prompt').value = f.prompt || '';
  $('#steps').value = f.steps || config[mode].steps;
  $('#count').value = f.count || 1;
  $('#seed').value = f.seed ?? -1;
  $('#upscale').checked = f.upscale ?? true;
  $('#strength').value = f.strength || 0.75;
  setInit(f.init);
}

// ---------- img2img source ----------
let initName = null;
function setInit(name) {
  initName = name || null;
  $('#init-pv').hidden = $('#init-clear').hidden = !initName;
  $('#init-hint').hidden = !!initName;
  $('#strength-row').hidden = !initName;
  if (initName) $('#init-pv').src = '/inputs/' + encodeURIComponent(initName);
  $('#strength-val').textContent = (+$('#strength').value).toFixed(2);
  $('#go').textContent = initName ? 'Сгенерировать из картинки' : 'Сгенерировать';
  saveForm();
}
async function uploadInit(body) {
  const r = await api('/api/init', body);
  if (r.error) return toast(r.error);
  setInit(r.init); toast('Исходная картинка задана');
  // the size list holds one aspect (2:3); turn it to the source's orientation, the rest is center-cropped
  const img = new Image();
  img.onload = () => { if (img.width !== img.height && (img.width > img.height) !== landscape) $('#flip').click(); };
  img.src = '/inputs/' + encodeURIComponent(r.init);
}
function readFile(file) {
  if (!file?.type.startsWith('image/')) return false;
  const fr = new FileReader(); fr.onload = () => uploadInit({data: fr.result}); fr.readAsDataURL(file);
  return true;
}
$('#init').onclick = ev => { if (ev.target.id !== 'init-clear') $('#init-file').click(); };
$('#init-file').onchange = () => { readFile($('#init-file').files[0]); $('#init-file').value = ''; };
$('#init-clear').onclick = () => setInit(null);
$('#init').ondragover = ev => { ev.preventDefault(); $('#init').classList.add('over'); };
$('#init').ondragleave = () => $('#init').classList.remove('over');
$('#init').ondrop = ev => {
  ev.preventDefault(); $('#init').classList.remove('over');
  if (readFile(ev.dataTransfer.files[0])) return;
  const m = (ev.dataTransfer.getData('text/uri-list') || '').match(/\/images\/([^/?#]+)/);
  if (m) uploadInit({image: decodeURIComponent(m[1])});
};
document.addEventListener('paste', ev => {
  const f = [...ev.clipboardData.files].find(f => f.type.startsWith('image/'));
  if (f) { ev.preventDefault(); readFile(f); }
});
$('#strength').oninput = () => { $('#strength-val').textContent = (+$('#strength').value).toFixed(2); };
$('#strength').onchange = saveForm;
$('#mode').onchange = () => {
  const m = $('#mode').value; fillSizes(m); $('#steps').value = config[m].steps; saveForm();
  api('/api/preload', {mode: m}).then(pollState);
};
$('#unload').onclick = () => api('/api/unload', {}).then(pollState);
for (const id of ['prompt', 'size', 'steps', 'count', 'seed', 'upscale']) $('#' + id).addEventListener('change', saveForm);
$('#prompt').addEventListener('input', saveForm);
$('#flip').onclick = () => {
  landscape = !landscape;
  fillSizes($('#mode').value, landscape ? rev(config[$('#mode').value].sizes[$('#size').selectedIndex]) : config[$('#mode').value].sizes[$('#size').selectedIndex]);
  saveForm();
};
$('#seed-rand').onclick = () => { $('#seed').value = -1; saveForm(); };

async function generate() {
  const body = {mode: $('#mode').value, prompt: $('#prompt').value, size: $('#size').value,
                steps: +$('#steps').value, count: +$('#count').value, seed: +$('#seed').value,
                upscale: $('#upscale').checked, init: initName, strength: +$('#strength').value};
  const r = await api('/api/generate', body);
  if (r.error) toast(r.error); else { toast(body.count > 1 ? `В очереди: ${body.count}` : 'В очереди'); pollState(); }
}
$('#go').onclick = generate;
$('#err').onclick = () => { $('#err').hidden = true; };

// ---------- queue / progress ----------
const phaseText = {loading: 'загрузка модели', generating: 'генерация', sampling: 'шаг', decoding: 'декодирование',
                   upscaling: 'апскейл', done: 'готово'};
let lastPreviewStep = null;
async function pollState() {
  const s = await api('/api/state');
  const q = $('#queue'); q.innerHTML = '';
  for (const j of s.queue) {
    const cur = s.current.job === j.id ? s.current : null;
    let pct = 0, line = j.status === 'running' ? '' : 'в очереди';
    if (cur) {
      const per = cur.phase === 'sampling' ? 0.1 + 0.8 * cur.step / cur.total : cur.phase === 'decoding' ? 0.93 :
                  cur.phase === 'upscaling' ? 0.97 : cur.phase === 'generating' ? 0.05 : 0;
      pct = ((cur.index + per) / cur.count) * 100;
      line = `${cur.count > 1 ? `${cur.index + 1}/${cur.count} · ` : ''}${phaseText[cur.phase] || cur.phase}` +
             `${cur.phase === 'sampling' ? ` ${cur.step}/${cur.total}` : ''} · ${Math.round(cur.elapsed)} с`;
    }
    const el = document.createElement('div'); el.className = 'qitem';
    el.innerHTML = `<div class="row"><span>${config[j.mode]?.label || 'Апскейл'} · ${j.size || ''}</span>
      <button class="ghost fit" title="Отменить">✕</button></div><div class="p"></div>
      <div style="color:var(--dim)">${line}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
    el.querySelector('.p').textContent = j.prompt;
    if (cur && cur.step > 0 && j.kind === 'gen') {
      const pv = document.createElement('img'); pv.className = 'pv';
      pv.src = `/api/preview?s=${cur.job}-${cur.index}-${cur.step}`; el.prepend(pv);
    }
    el.querySelector('button').onclick = () => api('/api/cancel', {id: j.id}).then(pollState);
    q.append(el);
  }
  if (s.error?.time && s.error.time !== pollState.errTime) {
    if (pollState.errTime !== undefined) {
      $('#err').textContent = 'Ошибка генерации (код ' + s.error.code + '):\n' + s.error.text.split('\n').slice(-6).join('\n');
      $('#err').hidden = false;
    }
    pollState.errTime = s.error.time;
  } else if (pollState.errTime === undefined) pollState.errTime = s.error?.time ?? 0;
  if (s.version !== version) await loadHistory(true);
  showPreview(s.current);
  $('#loaded').classList.toggle('on', !!s.loaded);
  $('#loaded-text').textContent = s.loaded ? `в памяти: ${config[s.loaded].label}` :
    (s.current.phase === 'loading' ? 'загружается…' : 'модель не загружена');
  $('#unload').hidden = !s.loaded || s.queue.length > 0;
  clearTimeout(pollState.timer);
  pollState.timer = setTimeout(pollState, s.queue.length ? 700 : 3000);
}

// the live step preview takes the big view only while the newest image is the one being looked at
function showPreview(cur) {
  const key = cur && cur.step > 0 ? `${cur.job}-${cur.index}-${cur.step}` : null;
  if (key === lastPreviewStep) return;
  const following = !shown || shown === items[0]?.id;
  lastPreviewStep = key;
  if (!key) { if (following) renderView(); return; }
  if (!following) return;
  const v = $('#view');
  let img = v.querySelector('img.main');
  if (!img) { img = document.createElement('img'); img.className = 'main'; v.prepend(img); }
  v.querySelector('.empty').hidden = true;
  img.src = `/api/preview?s=${key}`;
}

// ---------- history ----------
function visible() {
  const q = $('#search').value.trim().toLowerCase();
  return items.filter(e => (filter === 'all' || e.fav) && (!q || e.prompt.toLowerCase().includes(q)));
}
async function loadHistory(newArrived) {
  const prevTop = items[0]?.id;
  const r = await api('/api/history');
  items = r.items; version = r.version;
  for (const id of [...selected]) if (!items.some(e => e.id === id)) selected.delete(id);
  if (newArrived && items[0] && items[0].id !== prevTop && prevTop !== undefined) shown = items[0].id;
  if (!items.some(e => e.id === shown)) shown = items[0]?.id ?? null;
  renderGrid(); renderView();
}
function renderGrid() {
  const g = $('#grid'), list = visible();
  g.innerHTML = '';
  document.body.classList.toggle('selecting', selecting);
  for (const e of list) {
    const t = document.createElement('div');
    t.className = 'thumb' + (e.id === shown ? ' active' : '') + (selected.has(e.id) ? ' sel' : '');
    t.innerHTML = `<img loading="lazy" src="/images/${encodeURIComponent(e.file)}"><span class="chk"></span>` +
                  (e.fav ? '<span class="star">★</span>' : '');
    t.title = e.prompt;
    t.onclick = ev => {
      if (selecting || ev.ctrlKey || ev.shiftKey) { toggleSelect(e.id, ev.shiftKey); return; }
      shown = e.id; renderGrid(); renderView();
    };
    g.append(t);
  }
  $('#count-info').textContent = selecting ? `выбрано ${selected.size} из ${list.length}` : `${list.length} шт.`;
  for (const id of ['sel-all', 'sel-fav', 'sel-trash']) $('#' + id).hidden = !selecting;
  $('#select').classList.toggle('on', selecting);
  $('#trash-all').hidden = selecting;
}
let lastPick = null;
function toggleSelect(id, range) {
  if (!selecting) { selecting = true; }
  const list = visible().map(e => e.id);
  if (range && lastPick && list.includes(lastPick)) {
    const [a, b] = [list.indexOf(lastPick), list.indexOf(id)].sort((x, y) => x - y);
    list.slice(a, b + 1).forEach(i => selected.add(i));
  } else selected.has(id) ? selected.delete(id) : selected.add(id);
  lastPick = id; renderGrid();
}
function current() { return items.find(e => e.id === shown); }
function renderView() {
  const e = current(), v = $('#view');
  v.querySelector('.empty').hidden = !!e;
  let img = v.querySelector('img.main');
  if (!e) { img?.remove(); $('#meta').hidden = true; return; }
  if (!img) { img = document.createElement('img'); img.className = 'main'; v.prepend(img); }
  img.src = `/images/${encodeURIComponent(e.file)}`;
  $('#meta').hidden = false;
  $('#m-prompt').textContent = e.prompt;
  const when = new Date(e.created * 1000).toLocaleString('ru-RU', {dateStyle: 'short', timeStyle: 'short'});
  const sz = e.out_size && e.out_size !== e.size ? `${e.size} → ${e.out_size}` : e.size;
  $('#m-params').textContent = [config[e.mode]?.label || e.mode, sz.replaceAll('x', '×'), `${e.steps} шаг.`,
    `seed ${e.seed}`, `${e.duration} с`, when].concat(e.upscaled_from ? ['апскейл'] : [],
    e.init ? [`img2img ${e.strength}`] : []).join(' · ');
  $('#m-fav').textContent = e.fav ? '★' : '☆';
  $('#m-fav').classList.toggle('on', e.fav);
}
function step(d) {
  const list = visible(), i = list.findIndex(e => e.id === shown);
  const n = list[Math.min(list.length - 1, Math.max(0, i + d))];
  if (n) { shown = n.id; renderGrid(); renderView();
           document.querySelector('.thumb.active')?.scrollIntoView({inline: 'nearest', block: 'nearest'}); }
}
$('#nav-prev').onclick = () => step(-1);
$('#nav-next').onclick = () => step(1);

async function setFav(ids, fav) { await api('/api/fav', {ids, fav}); await loadHistory(); }
async function toTrash(ids, ask) {
  if (!ids.length) return;
  if (ask && !confirm(`Переместить в корзину ${ids.length} шт.?`)) return;
  const list = visible(), i = list.findIndex(e => e.id === shown);
  if (ids.includes(shown)) shown = list.filter(e => !ids.includes(e.id))[Math.max(0, i - 1)]?.id ?? null;
  const r = await api('/api/trash', {ids});
  ids.forEach(id => selected.delete(id));
  toast(`В корзине: ${r.trashed}`); await loadHistory();
}
$('#m-fav').onclick = () => { const e = current(); if (e) setFav([e.id], !e.fav); };
$('#m-trash').onclick = () => { const e = current(); if (e) toTrash([e.id], false); };
$('#m-copy').onclick = () => { const e = current(); if (e) navigator.clipboard.writeText(e.prompt).then(() => toast('Промпт скопирован')); };
$('#m-seed').onclick = () => { const e = current(); if (e) { $('#seed').value = e.seed; saveForm(); toast(`Seed ${e.seed}`); } };
$('#m-reuse').onclick = () => {
  const e = current(); if (!e || !config[e.mode]) return;
  $('#mode').value = e.mode; fillSizes(e.mode, e.size);
  $('#prompt').value = e.prompt; $('#steps').value = e.steps; $('#seed').value = e.seed;
  if (e.init) $('#strength').value = e.strength;
  setInit(e.init);
  toast('Настройки подставлены');
};
$('#m-init').onclick = () => { const e = current(); if (e) uploadInit({image: e.file}); };
$('#m-up').onclick = () => { const e = current(); if (e) api('/api/upscale', {id: e.id}).then(() => { toast('Апскейл в очереди'); pollState(); }); };

$('#f-all').onclick = () => { filter = 'all'; $('#f-all').classList.add('on'); $('#f-fav').classList.remove('on'); renderGrid(); };
$('#f-fav').onclick = () => { filter = 'fav'; $('#f-fav').classList.add('on'); $('#f-all').classList.remove('on'); renderGrid(); };
$('#search').oninput = renderGrid;
$('#select').onclick = () => { selecting = !selecting; if (!selecting) selected.clear(); renderGrid(); };
$('#sel-all').onclick = () => { visible().forEach(e => selected.add(e.id)); renderGrid(); };
$('#sel-fav').onclick = () => setFav([...selected], true);
$('#sel-trash').onclick = () => toTrash([...selected], true);
$('#trash-all').onclick = () => toTrash(visible().map(e => e.id), true);
$('#folder').onclick = () => api('/api/open_folder', {});

document.addEventListener('keydown', ev => {
  const typing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName);
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); generate(); return; }
  if (typing) return;
  if (ev.key === 'ArrowLeft') step(-1);
  else if (ev.key === 'ArrowRight') step(1);
  else if (ev.key === 'f' || ev.key === 'а') $('#m-fav').click();
  else if (ev.key === 'Delete') selecting && selected.size ? toTrash([...selected], true) : $('#m-trash').click();
  else if (ev.key === 's' || ev.key === 'ы') $('#select').click();
  else if (ev.key === 'Escape') { selecting = false; selected.clear(); renderGrid(); }
});

(async () => {
  config = await api('/api/config');
  for (const [k, v] of Object.entries(config)) {
    const o = document.createElement('option'); o.value = k; o.textContent = v.label; $('#mode').append(o);
  }
  loadForm();
  await loadHistory();
  api('/api/preload', {mode: $('#mode').value});
  pollState();
})();
</script>
</body>
</html>
